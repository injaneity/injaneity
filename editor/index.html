<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;display=swap" />
    <title>writing desk · zanechee.dev</title>
    <script type="module" src="/src/editor/entry.ts"></script>
  </head>
  <body class="editor-page">
    <main class="owner-gate" id="owner-gate">
      <a class="desk-home" href="/">⎇ zanechee.dev</a>
      <p id="owner-message" role="status">opening…</p>
      <button type="button" id="owner-retry" hidden>try again</button>
    </main>
    <div class="editor-shell" hidden>
      <header class="desk-header">
        <a class="desk-home" href="/">⎇ zanechee.dev</a>
        <button type="button" id="open-contents" aria-label="Editor actions" aria-keyshortcuts="Meta+k Control+k" aria-haspopup="dialog" aria-controls="contents">···</button>
      </header>
      <main class="desk-body" aria-label="Writing page"><div id="manuscript"></div></main>
      <p id="editor-error" role="alert" hidden></p>
      <dialog id="contents" aria-labelledby="contents-title">
        <div class="contents-header"><h1 id="contents-title">drafts</h1><button type="button" id="close-contents" aria-label="Close">×</button></div>
        <p id="contents-note">drafts stay in this browser until downloaded · not published</p>
        <div class="contents-actions"><button type="button" id="new-draft">new</button><button type="button" id="import-draft">import</button><button type="button" id="export-draft">download markdown</button></div>
        <div id="documents"></div>
        <details class="page-details"><summary>page details</summary><label class="sr-only" for="metadata">markdown frontmatter</label><textarea id="metadata" spellcheck="false" aria-label="markdown frontmatter"></textarea></details>
        <button type="button" id="owner-signout">sign out</button>
      </dialog>
      <input type="file" id="markdown-file" accept=".md,.markdown,text/markdown,text/plain" hidden />
    </div>
    <noscript>sign-in needs javascript. <a href="/writing/">read the blog</a> without it.</noscript>
    <!-- ink-filter -->
  </body>
</html>
